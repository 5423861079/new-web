<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー(全て税込) - レストラン</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1e293b; 
            line-height: 1.6; 
            text-align: center; 
            background-image: url('IMG_3693.jpeg'); 
            background-attachment: fixed; 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            padding-bottom: 40px;
        }

        /* ヘッダーのガラス表現 */
        header { 
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 25px 20px; 
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.05em;
        }

        /* メインコンテナのガラス表現 */
        main { 
            padding: 30px 24px; 
            max-width: 550px; 
            margin: 0 auto; 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.25));
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.18);
            text-align: left; 
        }

        /* メニュー項目のカード化＆ガラス表現 */
        .menu-item { 
            background: rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            padding: 16px 20px; 
            margin-bottom: 12px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-weight: 600; 
            font-size: 1.05rem;
            color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .menu-price {
            font-weight: 700;
            color: #0284c7;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 戻るボタンのガラススタイル */
        .back-btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .back-btn { 
            display: inline-block; 
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.85), rgba(3, 105, 161, 0.9));
            color: white; 
            padding: 12px 28px; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }

        .back-btn:hover { 
            background: linear-gradient(135deg, rgba(2, 132, 199, 1), rgba(3, 105, 161, 1));
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.45);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <h1>メニュー (全て税込)</h1>
    </header>
    <main>
        <!-- 白米 -->
        <div class="menu-item">
            <span>白米（ごはん）</span>
            <span class="menu-price">400円</span>
        </div>

        <!-- えすかるご焼き -->
        <div class="menu-item">
            <span>えすかるご焼き</span>
            <span class="menu-price">700円</span>
        </div>

        <!-- 純豆腐チゲ -->
        <div class="menu-item">
            <span>純豆腐チゲ</span>
            <span class="menu-price">1,250円</span>
        </div>

        <!-- 韓国海苔5枚 -->
        <div class="menu-item">
            <span>韓国海苔5枚</span>
            <span class="menu-price">250円</span>
        </div>

        <!-- みかんジュース -->
        <div class="menu-item">
            <span>みかんジュース</span>
            <span class="menu-price">400円</span>
        </div>

        <div class="back-btn-container">
            <a href="index.html" class="back-btn">← ホームへ戻る</a>
        </div>
    </main>
</body>
</html>
