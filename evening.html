<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レストラン</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333; line-height: 1.6; text-align: center;
            background-image: url('IMG_3693.jpeg'); background-attachment: fixed; background-size: cover; background-position: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 24px 20px; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        header.dark {
            background: rgba(18, 22, 28, 0.85);
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 { font-size: 1.35rem; font-weight: 700; }

        .card { 
            padding: 28px 20px; max-width: 500px; margin: 24px auto; 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08); text-align: left; 
        }

        .card.dark {
            background: rgba(26, 30, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f0f0f0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .btn {
            display: block; width: 100%; padding: 14px 20px; margin-bottom: 12px;
            font-size: 1rem; font-weight: bold; text-align: center; text-decoration: none;
            border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s;
        }
        .btn-blue { background: #3b71ca; color: white; }
        .btn-dark { background: #1f2937; color: white; }
        .btn-green { background: #388e3c; color: white; }

        .menu-item { 
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px; padding: 16px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .dark .menu-item {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .dark .price { color: #60a5fa; }

        .info-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .info-table th, .info-table td { padding: 10px 0; border-bottom: 1px dashed rgba(0,0,0,0.1); font-size: 0.95rem; }
        .info-table th { text-align: left; width: 35%; color: #555; }
        .info-table td { text-align: right; font-weight: bold; }

        .note { font-size: 0.9rem; color: #a0aec0; margin-top: 16px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- TOP画面 -->
    <div id="view-home">
        <header><h1>レストラン</h1></header>
        <main class="card">
            <h2 style="font-size: 1.1rem; text-align: center; margin-bottom: 16px;">お品書き（メニュー）</h2>
            <p style="text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: #666;">ご覧になりたいメニューを選んでください。</p>
            
            <button class="btn btn-blue" onclick="showView('general')">一般メニューを見る</button>
            <button class="btn btn-dark" onclick="showView('evening')">夜メニューを見る</button>
        </main>

        <main class="card">
            <h2 style="font-size: 1.1rem; text-align: center; margin-bottom: 16px;">スマホアプリのように使う</h2>
            <p style="text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: #666;">ホーム画面に追加すると、次回からアプリ感覚ですぐにメニューを開けます。</p>
            <button class="btn btn-green" id="installBtn" onclick="installApp()">📱 ホーム画面への追加方法</button>
        </main>

        <!-- 復活した店舗情報ブロック -->
        <main class="card">
            <h2 style="font-size: 1.1rem; text-align: center; margin-bottom: 12px;">店舗情報</h2>
            <table class="info-table">
                <tr><th>営業時間</th><td>11:30 〜 21:00</td></tr>
                <tr><th>住所</th><td>東京都渋谷区</td></tr>
                <tr><th>電話番号</th><td>03-XXXX-XXXX</td></tr>
            </table>
        </main>
    </div>

    <!-- 昼メニュー画面 -->
    <div id="view-general" class="hidden">
        <header><h1>メニュー (全て税込)</h1></header>
        <main class="card">
            <div class="menu-item"><span>白米（ごはん）</span><span>400円</span></div>
            <div class="menu-item"><span>えすかるご焼き</span><span>700円</span></div>
            <div class="menu-item"><span>純豆腐チゲ</span><span>1,250円</span></div>
            <div class="menu-item"><span>韓国海苔5枚</span><span>250円</span></div>
            <div class="menu-item"><span>みかんジュース</span><span>400円</span></div>
            <button class="btn btn-blue" style="margin-top:20px; border-radius:24px;" onclick="showView('home')">ホームへ戻る</button>
        </main>
    </div>

    <!-- 夜メニュー画面（黒ベース） -->
    <div id="view-evening" class="hidden">
        <header class="dark"><h1>18:00以降メニュー(全て税込)</h1></header>
        <main class="card dark">
            <div class="menu-item">
                <span>夜限定食べ放題</span>
                <span class="price">2,500円</span>
            </div>
            <p class="note">※それ以外のメニューは、全ていつも通りです</p>
            <button class="btn btn-blue" style="margin-top:24px; border-radius:24px;" onclick="showView('home')">ホームへ戻る</button>
        </main>
    </div>

    <script>
        function showView(viewName) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-general').classList.add('hidden');
            document.getElementById('view-evening').classList.add('hidden');
            document.getElementById('view-' + viewName).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        /* PWA ホーム画面追加機能のコントロール */
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert('【ホーム画面への追加方法】\n\n・iPhone (Safari) の場合:\n画面下の共有ボタン（□に↑）をタップし、「ホーム画面に追加」を選んでください。\n\n・Android (Chrome) の場合:\n右上の「⋮」メニューから「ホーム画面に追加」または「アプリをインストール」を選んでください。');
            }
        }
    </script>
</body>
</html>
